name: Clave del panel de ventas

# Reemplaza el link privado del panel. Recibe el HASH (SHA-256) de la clave, nunca la clave.
on:
  workflow_dispatch:
    inputs:
      hash:
        description: "Hash SHA-256 de la nueva clave"
        required: true

jobs:
  clave:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      HASH: ${{ inputs.hash }}
    steps:
      - run: |
          if ! printf '%s' "$HASH" | grep -Eq '^[0-9a-f]{64}$'; then echo "::error::Hash inválido"; exit 1; fi
          sql="delete from public.panel_claves; insert into public.panel_claves (hash) values ('$HASH');"
          jq -n --arg q "$sql" '{query: $q}' > c.json
          codigo=$(curl -sS -o r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/futhqkqfjuuemhcxzakn/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @c.json)
          if [ "$codigo" -ge 300 ]; then echo "::error::Supabase respondio $codigo"; exit 1; fi
          echo "::notice::Clave del panel actualizada (la anterior dejó de funcionar)"
