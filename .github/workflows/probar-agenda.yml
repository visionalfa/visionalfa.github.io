name: Probar la agenda

# Hace una reserva de prueba por cada servicio, revisa que se cree el link de pago y libera los horarios.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: futhqkqfjuuemhcxzakn
      FN: https://futhqkqfjuuemhcxzakn.supabase.co/functions/v1/agenda
      CLAVE: sb_publishable_x20gCAkWL2NsZG84wiWgGQ_hlchdMOF
    steps:
      - name: Probar
        run: |
          set -e
          servicios=$(curl -sS "$FN?servicios=1" -H "apikey: $CLAVE" | jq -r '.servicios[].id')
          [ -n "$servicios" ] || { echo "::error::No devolvió servicios"; exit 1; }
          for s in $servicios; do
            curl -sS "$FN?servicio=$s" -H "apikey: $CLAVE" > t.json
            n=$(jq '.turnos | length' t.json)
            ultimo=$(jq -r '.turnos[-1]' t.json)
            jq -n --arg i "$ultimo" --arg s "$s" '{accion:"reservar", servicio:$s, inicio:$i, nombre:"Prueba del sistema", email:"cliente.prueba@example.com", whatsapp:"0000 0000 0000", tema:"Prueba automática"}' > r.json
            curl -sS -X POST "$FN" -H "apikey: $CLAVE" -H "Content-Type: application/json" --data @r.json > res.json
            url=$(jq -r '.url // empty' res.json)
            if [ -n "$url" ]; then
              token=$(jq -r '.token' res.json)
              ocupado=$(curl -sS "$FN?servicio=$s" -H "apikey: $CLAVE" | jq --arg i "$ultimo" '.turnos | index($i) == null')
              echo "::notice::$s · $n turnos ($(jq -r '.servicio | "\(.hora_desde)-\(.hora_hasta) hs, $\(.precio)"' t.json)) · primero $(jq -r '.turnos[0]' t.json) · link de pago OK · horario bloqueado mientras paga: $ocupado"
              q="update public.reservas set estado = 'vencida' where token = '$token' returning estado;"
              jq -n --arg q "$q" '{query:$q}' > c.json
              curl -sS -o /dev/null -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @c.json
            else
              echo "::error::$s: no se creó el link de pago: $(cat res.json)"
            fi
          done
          # Superposición: la reserva de 2 horas tiene que bloquear la asesoría de 1 hora en el mismo horario
          ini=$(curl -sS "$FN?servicio=web-automatizada" -H "apikey: $CLAVE" | jq -r '.turnos[-1]')
          jq -n --arg i "$ini" '{accion:"reservar", servicio:"web-automatizada", inicio:$i, nombre:"Prueba del sistema", email:"cliente.prueba@example.com", whatsapp:"0000 0000 0000"}' > r.json
          tok=$(curl -sS -X POST "$FN" -H "apikey: $CLAVE" -H "Content-Type: application/json" --data @r.json | jq -r '.token')
          segunda=$(date -u -d "$ini + 1 hour" +%Y-%m-%dT%H:%M:%S.000Z)
          libre=$(curl -sS "$FN?servicio=asesoria" -H "apikey: $CLAVE" | jq --arg a "$ini" --arg b "$segunda" '[.turnos | index($a), index($b)] | map(. == null) | all')
          echo "::notice::Reserva de 2 hs bloquea las dos horas de la asesoría: $libre"
          q="update public.reservas set estado = 'vencida' where token = '$tok' returning estado;"
          jq -n --arg q "$q" '{query:$q}' > c.json
          curl -sS -o /dev/null -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @c.json
