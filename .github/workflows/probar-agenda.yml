name: Probar la agenda

# Hace una reserva de prueba (a nombre de "Prueba del sistema"), revisa que se cree el link de pago y libera el horario.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: futhqkqfjuuemhcxzakn
      FN: https://futhqkqfjuuemhcxzakn.supabase.co/functions/v1/agenda
      CLAVE: sb_publishable_x20gCAkWL2NsZG84wiWgGQ_hlchdMOF
    steps:
      - name: Probar
        run: |
          set -e
          curl -sS "$FN" -H "apikey: $CLAVE" > turnos.json
          n=$(jq '.turnos | length' turnos.json || echo 0)
          echo "::notice::Turnos libres: $n · primero: $(jq -r '.turnos[0]' turnos.json) · último: $(jq -r '.turnos[-1]' turnos.json)"
          [ "$n" -gt 0 ] || { echo "::error::No devolvió turnos: $(head -c 300 turnos.json)"; exit 1; }
          ultimo=$(jq -r '.turnos[-1]' turnos.json)
          jq -n --arg i "$ultimo" '{accion:"reservar", inicio:$i, nombre:"Prueba del sistema", email:"visionalfa.arg@gmail.com", whatsapp:"0000 0000 0000", tema:"Reserva de prueba automática: se cancela sola."}' > r.json
          curl -sS -X POST "$FN" -H "apikey: $CLAVE" -H "Content-Type: application/json" --data @r.json > res.json
          echo "::notice::Reserva: $(cat res.json)"
          url=$(jq -r '.url // empty' res.json)
          [ -n "$url" ] || { echo "::error::No devolvió link de pago: $(cat res.json)"; exit 1; }
          echo "::notice::Link de pago de Mercado Pago creado: $(echo "$url" | cut -c1-60)…"
          token=$(jq -r '.token' res.json)
          curl -sS "$FN?token=$token" -H "apikey: $CLAVE" > info.json
          echo "::notice::Estado de la reserva: $(jq -c '{estado, cuando, vence}' info.json)"
          jq -n --arg t "$token" '{accion:"pagar", token:$t}' > p.json
          curl -sS -X POST "$FN" -H "apikey: $CLAVE" -H "Content-Type: application/json" --data @p.json | jq -e '.url' > /dev/null && echo "::notice::Reintento de pago: OK"
          # Limpieza: libera el horario de prueba
          q="update public.reservas set estado = 'vencida' where token = '$token' returning estado;"
          jq -n --arg q "$q" '{query:$q}' > c.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @c.json
          curl -sS "$FN" -H "apikey: $CLAVE" | jq -e --arg i "$ultimo" '.turnos | index($i) != null' > /dev/null && echo "::notice::El horario de prueba quedó libre de nuevo"
