name: Actualizar sistema de ventas

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: futhqkqfjuuemhcxzakn
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que estén las claves
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan los secretos SUPABASE_ACCESS_TOKEN o SUPABASE_DB_PASSWORD en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conectar con el proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Actualizar la base de datos
        run: supabase db push

      - name: Publicar funciones
        run: |
          supabase functions deploy checkout   --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy mp-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy leer       --no-verify-jwt --project-ref "$PROJECT_REF"
