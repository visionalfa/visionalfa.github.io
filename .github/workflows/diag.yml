name: Revisar web
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in index.html equipo.html agenda.html?servicio=orientacion-vocacional; do
            c=$(curl -sS -o p.html -w "%{http_code}" "https://visionalfa.github.io/$u")
            echo "::notice::$u → $c · $(grep -o '<title>[^<]*' p.html | head -1) · equipo-link: $(grep -c 'equipo.html' p.html)"
          done
