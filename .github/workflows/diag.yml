name: Revisar web
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sql() { jq -n --arg q "$1" '{query:$q}' > c.json; curl -sS -X POST https://api.supabase.com/v1/projects/futhqkqfjuuemhcxzakn/database/query -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" --data @c.json | jq -c . | tr -d '\n'; }
          echo "::notice title=total::$(sql "select count(distinct sesion) as visitantes, count(*) filter (where evento='vista') as paginas_vistas, to_char(min(creada) - interval '3 hours','DD/MM') as desde from public.visitas")"
          echo "::notice title=paginas::$(sql "select pagina, count(*) as vistas, count(distinct sesion) as personas from public.visitas where evento='vista' group by 1 order by 2 desc")"
          echo "::notice title=clics::$(sql "select detalle, count(*) as clics from public.visitas where evento='clic' group by 1 order by 2 desc limit 20")"
          echo "::notice title=origen::$(sql "select coalesce(origen,'?') as origen, count(distinct sesion) as personas from public.visitas where evento='vista' and origen is not null group by 1 order by 2 desc")"
          echo "::notice title=dispositivo::$(sql "select dispositivo, count(distinct sesion) from public.visitas group by 1")"
