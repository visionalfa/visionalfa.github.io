name: Revisar web
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sql() { jq -n --arg q "$1" '{query:$q}' > c.json; curl -sS -X POST https://api.supabase.com/v1/projects/futhqkqfjuuemhcxzakn/database/query -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" --data @c.json | jq -c . | tr -d '\n'; }
          echo "::notice title=cuentas::$(sql "select count(*) as total, count(*) filter (where u.email in (select email from public.admins)) as admins, count(*) filter (where u.email like '%example.com') as prueba, count(*) filter (where exists (select 1 from public.accesos a where a.user_id=u.id and a.estado='activo')) as con_compra, to_char(min(u.created_at) - interval '3 hours','DD/MM') as primera, to_char(max(u.created_at) - interval '3 hours','DD/MM HH24:MI') as ultima from auth.users u")"
          echo "::notice title=por dia::$(sql "select to_char(created_at - interval '3 hours','DD/MM') as dia, count(*) from auth.users where email not like '%example.com' group by 1 order by 1")"
