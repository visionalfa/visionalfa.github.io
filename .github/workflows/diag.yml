name: Revisar reservas
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q="select nombre, estado, inicio from public.reservas order by creada desc limit 5;"
          jq -n --arg q "$q" '{query:$q}' > c.json
          p=$(curl -sS -X POST "https://api.supabase.com/v1/projects/futhqkqfjuuemhcxzakn/database/query" -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" --data @c.json | jq -c .)
          echo "::notice::$p"
