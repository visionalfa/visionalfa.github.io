name: Revisar web
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sql() { jq -n --arg q "$1" '{query:$q}' > c.json; curl -sS -X POST https://api.supabase.com/v1/projects/futhqkqfjuuemhcxzakn/database/query -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" --data @c.json | jq -c . | tr -d '\n'; }
          echo "::notice title=accesos::$(sql "select a.producto_id, a.estado, left(a.mp_referencia,8) as ref, to_char(a.creado - interval '3 hours','DD/MM HH24:MI') as cuando, (u.email in (select email from public.admins)) as es_tuya, left(u.email,2)||'…@'||split_part(u.email,'@',2) as mail from public.accesos a join auth.users u on u.id=a.user_id order by a.creado")"
          echo "::notice title=pagos::$(sql "select producto_id, estado, monto, to_char(creado - interval '3 hours','DD/MM HH24:MI') as cuando, coalesce(detalle->>'payment_type_id','') as medio from public.pagos order by creado")"
