name: Revisar web
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sql() { jq -n --arg q "$1" '{query:$q}' > c.json; curl -sS -X POST https://api.supabase.com/v1/projects/futhqkqfjuuemhcxzakn/database/query -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" -H "Content-Type: application/json" --data @c.json | jq -c . | tr -d '\n'; }
          R=$(sql "select servicio_id, estado, monto, (pago_id is not null) as con_pago, to_char(inicio - interval '3 hours','DD/MM HH24:MI') as turno, to_char(creada - interval '3 hours','DD/MM HH24:MI') as creada, nombre = 'Prueba del sistema' as es_prueba from public.reservas where creada > now() - interval '3 days' order by creada desc limit 15")
          echo "::notice title=reservas::$R"
          P=$(sql "select producto_id, estado, monto, to_char(creado - interval '3 hours','DD/MM HH24:MI') as cuando from public.pagos where creado > now() - interval '3 days' order by creado desc limit 15")
          echo "::notice title=pagos::$P"
