name: Bloquear un día de la agenda

# Para feriados, vacaciones o días que no atendés. Los turnos ya reservados ese día no se tocan.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día (formato AAAA-MM-DD, por ejemplo 2026-11-20)"
        required: true
      accion:
        description: "Bloquear o volver a habilitar"
        required: true
        type: choice
        options: [bloquear, habilitar]
      agenda:
        description: "Agenda de quién"
        required: true
        type: choice
        options: [todas, florentina, carla, marcelo, juliana]
      motivo:
        description: "Motivo (opcional, solo para vos)"
        required: false

jobs:
  dia:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: futhqkqfjuuemhcxzakn
      FECHA: ${{ inputs.fecha }}
      ACCION: ${{ inputs.accion }}
      MOTIVO: ${{ inputs.motivo }}
      AGENDA: ${{ inputs.agenda }}
    steps:
      - name: Aplicar
        run: |
          fecha=$(printf '%s' "$FECHA" | tr -d ' ')
          if ! printf '%s' "$fecha" | grep -Eq '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$'; then echo "::error::La fecha tiene que ser AAAA-MM-DD, por ejemplo 2026-11-20"; exit 1; fi
          agenda="$AGENDA"; [ "$agenda" = "todas" ] && agenda=""
          if ! printf '%s' "$agenda" | grep -Eq '^[a-z]*$'; then echo "::error::Agenda inválida"; exit 1; fi
          motivo=$(printf '%s' "$MOTIVO" | tr -d "'\\\\" | cut -c1-100)
          if [ "$ACCION" = "bloquear" ]; then
            sql="insert into public.dias_bloqueados (fecha, agenda, motivo) values ('$fecha', '$agenda', '$motivo') on conflict (fecha, agenda) do update set motivo = excluded.motivo;"
          else
            sql="delete from public.dias_bloqueados where fecha = '$fecha' and agenda = '$agenda';"
          fi
          sql="$sql select count(*) as reservas from public.reservas where estado = 'confirmada' and ('$agenda' = '' or agenda = '$agenda') and (inicio at time zone 'America/Argentina/Buenos_Aires')::date = '$fecha';"
          jq -n --arg q "$sql" '{query: $q}' > consulta.json
          codigo=$(curl -sS -o respuesta.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @consulta.json)
          if [ "$codigo" -ge 300 ]; then echo "::error::Supabase respondio $codigo: $(head -c 300 respuesta.json | tr -d '\n')"; exit 1; fi
          n=$(jq -r '.[0].reservas // 0' respuesta.json)
          echo "::notice::Listo: $fecha → $ACCION. Turnos ya reservados ese día: $n"
          if [ "$n" != "0" ] && [ "$ACCION" = "bloquear" ]; then echo "::warning::Ese día ya tenía $n turno(s) reservado(s). Avisales a esas personas."; fi
